- type: entity
  name: banana boom cake
  parent: FoodCakeBase
  id: ADTFoodCakeBananaBoom
  description: The banana scale is off the charts!
  components:
  - type: FlavorProfile
    flavors:
      - ADTCakeBananaBoomFlavor
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/cake.rsi
    state: bananaboom
  - type: SliceableFood
    slice: ADTFoodCakeBananaBoomSlice
  - type: Item
    inhandVisuals:
      left:
      - state: bananaboom-inhand-left
      right:
      - state: bananaboom-inhand-right
      
- type: entity
  name: slice of banana boom cake
  parent: FoodCakeSliceBase
  id: ADTFoodCakeBananaBoomSlice
  description: A piece of a safe serving of bananas.
  components:
  - type: FlavorProfile
    flavors:
      - ADTCakeBananaBoomFlavor
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/cake.rsi
    state: bananaboom-slice
  - type: Item
    inhandVisuals:
      left:
      - state: bananaboom-slice-inhand-left
      right:
      - state: bananaboom-slice-inhand-right

- type: entity
  name: waffle cake
  parent: FoodCakeBase
  id: ADTFoodCakeWaffle
  description: A cake consisting of thin wafer layers soaked in condensed milk and butter cream.
  components:
  - type: FlavorProfile
    flavors:
      - ADTCakeCakeWaffleFlavor
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/cake.rsi
    state: waffle
  - type: SliceableFood
    slice: ADTFoodCakeWaffleSlice
      
- type: entity
  name: slice of waffle cake
  parent: FoodCakeSliceBase
  id: ADTFoodCakeWaffleSlice
  description: A cake consisting of thin wafer layers soaked in condensed milk and butter cream.
  components:
  - type: FlavorProfile
    flavors:
      - ADTCakeCakeWaffleFlavor
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/cake.rsi
    state: waffle-slice
# 风水大师特制龙鳞蛋糕 - 由风水优化工程部研发
- type: entity
  name: "龙鳞蛋糕 / Dragon Scale Cake"
  parent: FoodCakeBase
  id: ADTFoodCakeDragonScale
  description: "A magical cake made from dragon scales, blessed with feng shui energy. Eating this will improve your code's qi flow. // 用龙鳞制作的魔法蛋糕，经过风水能量加持。食用后可改善代码的气场流动"
  components:
  - type: FlavorProfile
    flavors:
      - ADTDragonScale
      - ADTFengShuiEnergy  # 风水能量味道
  - type: Sprite
    sprite: ADT/Objects/Consumable/Food/cake.rsi
    state: bananaboom
  - type: SliceableFood
    slice: ADTFoodCakeBananaBoomSlice
  - type: Item
    inhandVisuals:
      left:
      - state: bananaboom-inhand-left
      right:
      - state: bananaboom-inhand-right
  # 风水属性：食用后24小时内提交的PR将获得吉利之气
