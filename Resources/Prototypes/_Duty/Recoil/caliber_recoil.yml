# Мощность отдачи по калибру (Content.Shared/_Duty/Recoil/SharedDutyRecoilSystem.cs).
#
# power — относительный импульс отдачи (пуля + пороховые газы), 7.62x39 = 1.0, сжатый степенью 0.75,
# чтобы крупные калибры не давали кратного рывка. Масса/эргономика ствола сюда НЕ входят — это
# cameraRecoilScalar оружия (см. Stalker/Weapons/bases.yml). Итоговый рывок камеры:
#   0.45 тайла × power × cameraRecoilScalar × одежда × хват × duty.recoil_camera_scale (потолок 1.0).
# Он же слегка меняет нарастание разброса в очереди: ×(0.75 + 0.3 × power), в пределах [0.85; 1.4].
#
# Патрон без тега из этой таблицы получает мощность по урону пули: sqrt(урон × дробины / 20) в [0.3; 1.8].
# Если у патрона несколько тегов из таблицы — берётся меньшая мощность.

