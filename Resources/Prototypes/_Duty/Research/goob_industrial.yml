# OptimizedMicrogalvanism — ванильный тех, который ADT удалил (Research/industrial.yml,
# закомментирован как PortableFission, причина не указана) вместе с рецептами обеих ячеек
# в паке PowerCells. У губов тех на месте, цена там же поднята до 15000 — берём как у них.
# Рецепты возвращены в пак PowerCells.
#
# Тех QuantumLeaping из этой же серии не возвращаем: ADT снял его с пометкой
# «временно удалено до решения всех багов предмета» — это причина, а не молчаливый вырез.

- type: technology
  id: OptimizedMicrogalvanism
  name: research-technology-optimized-microgalvanism
  icon:
    sprite: Objects/Power/power_cells.rsi
    state: microreactor
  discipline: Industrial
  tier: 3
  cost: 15000
  recipeUnlocks:
  - PowerCellMicroreactor
  - PowerCellHyper
  position: 4,-3
  technologyPrerequisites:
  - AdvancedToolsTechnology
  - AdvancedPowercells
  requiredTech:
  - AdvancedToolsTechnology
  - AdvancedPowercells

