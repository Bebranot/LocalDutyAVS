# Специальные боеприпасы для сталкерских калибров. Обычные коробки печатаются в SecurityTechFab сразу
# (StalkerAmmoStatic), экспансивные и бронебойные — только после этих технологий (паки
# DutyAmmoExpansivePack / DutyAmmoArmorPiercingPack в dynamicPacks SecurityTechFab).
# Экспансивные открываются раньше: против брони они хуже обычных, их ниша — бездоспешные цели.
# Бронебойные — следующий шаг и дороже: это прямой ответ на бронежилеты.
# Позиции 3,0 и 4,0 в сетке Arsenal свободны (рядом ThermalWeaponry 5,0).

