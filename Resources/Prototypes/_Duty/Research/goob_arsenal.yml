# Ветка лазерного оружия на сменных энергоячейках, порт из Goob-Station
# (Resources/Prototypes/_Goobstation/Research/arsenal.yml).
#
# Стоимости и тиры взяты у губов без изменений. Позиции проставлены заново под нашу
# сетку дисциплины Arsenal: у губов все четыре дисциплины лежат на одном полотне,
# у нас каждая на своей вкладке со своими координатами.
#
# Заполняются оба поля пререквизитов: requiredTech — настоящий гейт и линии связей
# в консоли, technologyPrerequisites — только текст «требует:» в описании.
#
# Тех SmartWeaponry не переносим: он держится на подсистеме SmartGun, которой у нас нет.

- type: technology
  id: WeaponLaserCellRevolverTech
  name: research-technology-mag-fed-pistol
  icon:
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_revolver.rsi
    state: icon
  discipline: Arsenal
  tier: 1
  cost: 5000
  recipeUnlocks:
  - WeaponLaserCellRevolver
  - PowerCellIRRevolver
  position: 4,-1
  technologyPrerequisites:
  - DraconicMunitions
  requiredTech:
  - DraconicMunitions

