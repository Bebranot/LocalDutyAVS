# Портировано из Goob-Station (Resources/Prototypes/_EinsteinEngines/Interactions/noop_interactions.yml),
# изначально Einstein Engines.
# _Duty: звук ominous.ogg (LookAt/WaveAt в оригинале) не перенесён — не нашли для него attribution
# в исходном репозитории, а тащить звук без понятной лицензии не стали. Функционально не влияет:
# попап остаётся, теряется только декоративный звуковой стингер.

- type: Interaction
  id: LookAt
  parent: BaseGlobal
  priority: 4
  requiresHands: false
  requiresCanInteract: false
  contactInteraction: false
  allowSelfInteract: true
  icon: /Textures/Interface/Actions/eyeopen.png
  range: {max: 20}
  predictOwnFeedback: true
  effectSuccess:
    popup: Obvious
  action:
    !type:NoOpAction

- type: Interaction
  id: WaveAt
  parent: [BaseHands, BaseGlobal]
  priority: 3
  requiresCanInteract: false
  contactInteraction: false
  range: {max: 20}
  predictOwnFeedback: true
  effectSuccess:
    popup: Obvious
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement # Не машем руками неодушевлённым предметам
    inverted: true
  action:
    !type:NoOpAction

- type: Interaction
  id: Hug
  parent: [BaseGlobal, BaseHands]
  priority: 2
  delay: 0.7
  range: {max: 1}
  hideByRequirement: true
  requirement:
    !type:MobStateRequirement
    inverted: true
  action:
    # TODO: должно притягивать цель ближе или типа того — но для этого нужен отдельный Action.
    !type:NoOpAction

# Постучать по цели — двери и т.п.
- type: Interaction
  id: KnockOn
  parent: BaseHands
  priority: 20
  predictOwnFeedback: true
  effectSuccess:
    popup: Visible
    sound: {path: /Audio/Effects/glass_knock.ogg}
  action:
    !type:NoOpAction
