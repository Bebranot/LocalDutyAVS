# Портировано из Goob-Station (Resources/Prototypes/_EinsteinEngines/Interactions/base.yml), изначально Einstein Engines.

- type: Interaction
  id: Base
  abstract: true
  effectSuccess:
    popup: Small
  effectFailure:
    popup: SubtleFail

# Базовый глобальный интеракт-верб (доступен на любой сущности, без InteractionVerbsComponent)
- type: Interaction
  id: BaseGlobal
  abstract: true
  global: true

# Базовый интеракт-верб, использующий руки
- type: Interaction
  id: BaseHands
  abstract: true
  requiresHands: true
  requiresCanInteract: true
  contactInteraction: true
  range:
    max: 1.2
  effectSuccess:
    popup: Obvious
    sound: {path: /Audio/Effects/thudswoosh.ogg}
  effectFailure:
    popup: Fail
    sound: {path: /Audio/Effects/thudswoosh.ogg}

# Базовый интеракт-верб с "опасными" попапами (для будущих агрессивных вербов)
- type: Interaction
  id: BaseDangerous
  abstract: true
  effectSuccess:
    popup: Dangerous
    sound: {path: /Audio/Effects/thudswoosh.ogg}
  effectFailure:
    popup: Fail
    sound: {path: /Audio/Effects/thudswoosh.ogg}
  effectDelayed:
    popup: DangerousDelayed
