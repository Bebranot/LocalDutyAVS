# Городские стены и полы (90-е): перенесено из Stalker, ADT и ванили. Суффикс PortedSlPc.

- type: entity
  parent: BaseWall
  id: DutyWallStalkerConcretePortedSlPc
  suffix: Duty, Ported, SlPc
  components:
  - type: Sprite
    sprite: _Duty/Ported/City/Structures/Walls/stalker_concrete.rsi
  - type: Icon
    sprite: _Duty/Ported/City/Structures/Walls/stalker_concrete.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: DutyCityWallBreakPortedSlPc
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: concrete

