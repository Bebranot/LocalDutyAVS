- type: entity
  id: CatwalkSteelStalkerPortedDuty
  suffix: Ported
  placement:
    mode: SnapgridCenter
  components:
  - type: Clickable
  - type: Sprite
    sprite: _Duty/Ported/Stalker/Structures/catwalk1.rsi
    drawdepth: FloorTiles
  - type: Icon
    sprite: _Duty/Ported/Stalker/Structures/catwalk1.rsi
    state: catwalk_preview
  - type: Transform
    anchored: true
  - type: IconSmooth
    key: catwalk
    base: catwalk_
  - type: FootstepModifier
    footstepSoundCollection:
      collection: FootstepCatwalk
      params:
        volume: 8
  - type: Tag
    tags:
    - Catwalk
  - type: Damageable
    damageModifierSet: Metallic


