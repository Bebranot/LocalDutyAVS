  id: WindowStalkerSewerPortedDuty
  suffix: Ported
  components:
  - type: WallMount
    arc: 360
  - type: SpriteFade
  - type: Airtight
  - type: Tag
    tags:
    - Window
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb {}
        mask:
        - FullTileMask
        layer:
        - GlassLayer
  - type: Icon
    sprite: _Duty/Ported/Stalker/Structures/Windows/WindowsSewer.rsi
    state: icon
  - type: Sprite
    sprite: _Duty/Ported/Stalker/Structures/Windows/WindowsSewer.rsi
    layers:
    - state: windows
    drawdepth: Mobs
  - type: BlockWeather


