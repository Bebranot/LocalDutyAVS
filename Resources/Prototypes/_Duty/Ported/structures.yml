# Перенесено из Space Onyx и Stalker. Идентификаторы с суффиксом PortedDuty.

- type: entity
  parent: BaseWall
  id: WallMarblePortedDuty
  suffix: Ported
  components:
  - type: Sprite
    sprite: _Duty/Ported/Structures/Walls/marble.rsi
  - type: Icon
    sprite: _Duty/Ported/Structures/Walls/marble.rsi
  - type: RCDDeconstructable
    cost: 6
    delay: 8
    fx: EffectRCDDeconstruct8
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 500
      behaviors:
      - !type:SpawnEntitiesBehavior
        spawn:
          Girder:
            min: 1
            max: 1
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
  - type: IconSmooth
    key: walls
    base: wall


