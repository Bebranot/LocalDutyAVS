# Общая база киберимплантов _Duty (docs/neurointerface/cyberware_ideas.md).
# Каждый имплант — наследник одной из фракционных баз: фракция красит HUD и решает, видят ли его сканеры.
# Выдача пока только админская: импланты и операционные наборы — в спавн-меню с суффиксом «Duty, <фракция>».

- type: entity
  abstract: true
  parent: BaseSubdermalImplant
  id: DutyCyberImplantBase
  components:
