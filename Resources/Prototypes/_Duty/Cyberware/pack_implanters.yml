# Одноразовые наборы кибер-имплантеров для РДМ: мгновенно вживляют набор модулей и повышают лимит перегруза.

- type: entity
  abstract: true
  parent: BaseItem
  id: DutyBaseCyberPackImplanter
  name: cyberware pack implanter
  description: A single-use auto-implanter pre-loaded with a combat cyberware pack.
  categories: [ DoNotMap ]
  suffix: Duty, RDM, Имплантер
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter1
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: DutyCyberPackImplanter
    oneUse: true
    injectSound:
      path: /Audio/Items/hypospray.ogg

# --- NanoTrasen ---

