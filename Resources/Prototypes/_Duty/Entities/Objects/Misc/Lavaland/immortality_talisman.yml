- type: entity
  parent: [Incorporeal, BaseMob]
  id: ImmortalityPocket
  name: бессмертное нечто
  description: Выглядит как человек... Наверное...
  suffix: Duty, Артефакт
  components:
  - type: Spectral
  - type: MovementSpeedModifier
    baseSprintSpeed: 0
    baseWalkSpeed: 0
  - type: Sprite
    sprite: /Textures/_Duty/Objects/Lavaland/immortality_pocket.rsi
    state: icon


- type: polymorph
  id: ImmortalityVoidPocket
  configuration:
    entity: ImmortalityPocket
    transferName: false
    transferDamage: false # ImmortalityPocket не носит Damageable — прописано явно, а не полагается на молчаливый no-op
    inventory: None
    forced: false
    revertOnDeath: true
    revertOnCrit: false # у ImmortalityPocket нет MobState, так что сейчас это тоже no-op, но явно — надёжнее умолчания
    allowRepeatedMorphs: false
    polymorphSound: /Audio/Magic/ethereal_enter.ogg
    exitPolymorphSound: /Audio/Magic/ethereal_exit.ogg
    duration: 15
    effectProto: EffectDesynchronizer # визуальная вспышка на входе/выходе — без неё превращение выглядит как зависание клиента

- type: entity
  id: LavalandImmortalityTalisman
  parent: BaseItem
  name: талисман бессмертия
  description: Обычный камень скрывает в себе столько загадок... Рискнёте ли вы после кровавой битвы использовать его на себе?
  suffix: Duty, Артефакт
  components:
  - type: Sprite
    sprite: /Textures/_Duty/Objects/Lavaland/immortality_talisman.rsi
    state: icon
  - type: TriggerOnUse
  - type: PolymorphOnTrigger
    targetUser: true
    polymorph: ImmortalityVoidPocket
  - type: UseDelay
    delay: 60