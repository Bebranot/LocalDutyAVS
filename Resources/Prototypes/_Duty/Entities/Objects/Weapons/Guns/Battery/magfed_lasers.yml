# Линейка лазерного оружия на сменных энергоячейках из Goob-Station
# (Resources/Prototypes/_Goobstation/.../Battery/magfed_lasers.yml и battery_guns.yml).
#
# Что снято при переносе и почему:
#  - Cautery / SurgeryTool  — Shitmed: у губов лазером прижигают раны, у нас своя система травм;
#  - RestrictGunshotsByUserTag — механика расы Oni, которой у нас нет;
#  - Multishot — губовский твик разброса при стрельбе с двух рук, вшит в их SharedGunSystem;
#  - FoldingWeapon / BatterySlotRequiresToggle у револьвера — отдельные подсистемы губов.
#    Револьвер остаётся рабочим: ItemToggle и визуал взведения on/off сохранены,
#    ушла только необходимость складывать его для смены ячейки.

- type: entity
  id: BaseWeaponCustomCell
  parent: BaseItem
  abstract: true
  components:
  - type: Sprite
  - type: Item
    size: Huge
  - type: AmmoCounter
  - type: Gun
    fireRate: 2
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser.ogg
  - type: MagazineAmmoProvider
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: PowerCellSmall
        insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/batrifle_magout.ogg
        whitelist:
          tags:
          - PowerCell
          - PowerCellSmall
  - type: Appearance
  - type: StaticPrice
    price: 500
  - type: ContainerContainer
    containers:
      gun_magazine: !type:ContainerSlot
  - type: AlwaysHot
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 12
    angle: 0
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud
  - type: BatteryDrinkerSource
    maxAmount: 180

- type: entity
  id: BaseWeaponCustomCellSmall
  parent: BaseWeaponCustomCell
  abstract: true
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Clothing
    sprite: Objects/Weapons/Guns/Battery/taser.rsi
    quickEquip: false
    slots:
    - Belt
  - type: MeleeWeapon
    damage:
      types:
        Blunt: 8
    angle: 0
    wideAnimationRotation: 90
    soundHit:
      collection: MetalThud

# ── ER-5 «Торрент», лазерный ПП ──

- type: entity
  name: ER-5 «Торрент»
  parent: [ BaseWeaponCustomCell, BaseSecurityContraband ]
  id: WeaponLaserCellSMG
  description: Специализированный лазерный пистолет-пулемёт, рассчитанный на подавляющий огонь сквозь укрытия и быструю смену ячейки на ходу. Питается ячейками для ПП.
  components:
  - type: Item
    size: Large
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -19
    maxAngle: -16
  - type: Gun
    minAngle: 21
    maxAngle: 32
    fireRate: 6
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Duty/Weapons/Guns/Gunshots/laser_smg.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        whitelist:
          tags:
          - MilitaryPowerCellSMG
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_smg.rsi
    layers:
    - state: icon
      visible: false
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-4
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: PhysicalComposition
    materialComposition:
      Steel: 500
      Gold: 125
  - type: Clothing
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_smg.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: AmmoCounter

# ── ES-7 «Мультилинза», лазерная снайперская винтовка ──

- type: entity
  name: ES-7 «Мультилинза»
  parent: [ BaseWeaponCustomCell, BaseGunWieldable, BaseSecurityContraband ]
  id: WeaponLaserCellSniper
  description: Лазерная снайперская винтовка, бьющая очередью по три и сохраняющая мощность луча на предельной дистанции. Оснащена штатным оптическим прицелом. Питается снайперскими ячейками.
  components:
  - type: Item
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_sniper.rsi
    size: Huge
    shape:
    - 0,0,6,1
  - type: Gun
    burstFireRate: 15
    shotsPerBurst: 3
    burstCooldown: 1.5
    fireRate: 1.5
    selectedMode: Burst
    availableModes:
    - Burst
    soundGunshot:
      path: /Audio/_Duty/Weapons/Guns/Gunshots/laser_lmg.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        whitelist:
          tags:
          - MilitaryPowerCellSniper
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_sniper_icon_48x.rsi
    layers:
    - state: icon
      visible: false
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: PhysicalComposition
    materialComposition:
      Steel: 800
      Silver: 300
      Gold: 200
  - type: Clothing
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_sniper.rsi
    quickEquip: false
    slots:
    - back
    - suitStorage
  - type: GunRequiresWield
  - type: CursorOffsetRequiresWield
  - type: EyeCursorOffset
    maxOffset: 5
    pvsIncrease: 0.5
  - type: SpeedModifiedOnWield
    walkModifier: 0.8
    sprintModifier: 0.8
  - type: AmmoCounter

# ── EG-1 «Таро», лазерный револьвер ──

- type: entity
  name: EG-1 «Таро»
  parent: [ BaseWeaponCustomCellSmall, BaseSecurityContraband ]
  id: WeaponLaserCellRevolver
  description: Разрабатывался как личное оружие для отрядов безопасности NanoTrasen. Малоизвестная переломная лазерная револьверная платформа, быстро снятая с производства из-за ограничителя скорострельности, поставленного против перегрева. Питается револьверными ячейками.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,0
    - 0,1,0,1
  - type: Tag
    tags:
    - Sidearm
  - type: Gun
    selectedMode: SemiAuto
    fireRate: 1.5
    availableModes:
    - SemiAuto
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        whitelist:
          tags:
          - MilitaryPowerCellRevolver
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_revolver.rsi
    layers:
    - state: icon
      visible: false
    - state: mag-0
      visible: false
      shader: unshaded
      map: ["enum.GunVisualLayers.Mag"]
    - state: off
      map: ["base"]
  - type: PhysicalComposition
    materialComposition:
      Steel: 250
      Silver: 50
  - type: Clothing
    sprite: _Duty/Objects/Weapons/Guns/Battery/cell_revolver.rsi
    quickEquip: false
    slots:
    - suitStorage
    - belt
  - type: ItemToggle
    soundActivate: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
    soundDeactivate: /Audio/Weapons/Guns/Cock/revolver_cock.ogg
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: true
  - type: GenericVisualizer
    visuals:
      enum.ToggleableVisuals.Enabled:
        base:
          True: { state: on }
          False: { state: off }
  - type: AmmoCounter

# ── EL-20 HAMRR, лазерный пулемёт ──
# Питается не своей ячейкой, а батареей в ранце ClothingBackpackLMGBattery.

- type: entity
  name: EL-20 HAMRR
  parent: [ BaseItem, BaseSecurityContraband ]
  id: WeaponLaserLMG
  description: Неповоротливый лазерный пулемёт, питающийся от батареи в отдельном ранце. Компромиссы ради чудовищной скорострельности и бортового охлаждения сделали его тяжёлым и неточным.
  components:
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Battery/energy_lmg_icon_48x.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: light
      shader: unshaded
      map: ["enum.GunVisualLayers.BaseUnshaded"]
  - type: Item
    sprite: _Duty/Objects/Weapons/Guns/Battery/energy_lmg.rsi
    size: Huge
    shape:
    - 0,0,4,3
  - type: Wieldable
  - type: GunWieldBonus
    minAngle: -15
    maxAngle: -15
  - type: Gun
    minAngle: 50
    maxAngle: 20
    angleIncrease: -5
    angleDecay: -80
    fireRate: 10
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      path: /Audio/_Duty/Weapons/Guns/Gunshots/laser_lmg.ogg
  - type: AmmoCounter
  - type: StaticPrice
    price: 500
  - type: UseDelay
    delay: 1
  - type: Appearance
  - type: ClothingSlotAmmoProvider
  - type: SlotBasedConnectedContainer
    targetSlot: BACK
    containerWhitelist:
      tags:
      - LaserLMGBackpack
  - type: Tag
    tags:
    - LaserLMG

# ── CR-2 «Гера», энергетическая штурмовая винтовка ──

- type: entity
  name: CR-2 «Гера»
  parent: [ BaseWeaponCustomCell, BaseGunWieldable, BaseSecurityContraband ]
  id: WeaponEnergyRifle
  description: Универсальная плазменная штурмовая винтовка, выросшая из снятого с вооружения энергетического пистолета. Заряжается магазинами энерговинтовки.
  components:
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Battery/energy_rifle.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-unshaded-4
      map: ["enum.GunVisualLayers.MagUnshaded"]
      shader: unshaded
  - type: Item
    sprite: _Duty/Objects/Weapons/Guns/Battery/energy_rifle.rsi
    size: Large
  - type: Clothing
    sprite: _Duty/Objects/Weapons/Guns/Battery/energy_rifle.rsi
    quickEquip: false
    slots:
    - Back
    - suitStorage
  - type: MagazineVisuals
    magState: mag
    steps: 5
    zeroVisible: true
  - type: Gun
    soundGunshot:
      path: /Audio/Weapons/Guns/Gunshots/laser_cannon.ogg
    soundEmpty:
      path: /Audio/_Duty/Weapons/Guns/Empty/dry_fire.ogg
  - type: ItemSlots
    slots:
      gun_magazine:
        name: Magazine
        startingItem: EnergyMagRifleLethal
        insertSound: /Audio/Weapons/Guns/MagIn/revolver_magin.ogg
        ejectSound: /Audio/Weapons/Guns/MagOut/revolver_magout.ogg
        whitelist:
          tags:
          - EnergyMagAmmo
