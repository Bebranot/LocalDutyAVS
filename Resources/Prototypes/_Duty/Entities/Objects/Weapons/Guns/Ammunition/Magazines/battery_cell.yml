    layers:
    - map: [ "base" ]
      state: bluespace_charge
      shader: unshaded
  - type: Battery
    maxCharge: 750
    startingCharge: 750
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        base:
          True:
            state: bluespace_charge
            shader: unshaded
          False:
            state: bluespace
            shader: null
  - type: BatteryAmmoProvider
    proto: RevolverBluespaceLaser
    fireCost: 62.5

