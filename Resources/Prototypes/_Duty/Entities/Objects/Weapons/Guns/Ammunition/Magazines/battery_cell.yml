# Порт линейки боевых энергоячеек из Goob-Station
# (Resources/Prototypes/_Goobstation/.../Magazines/battery_cell.yml).
#
# Отличия от оригинала:
#  - ионные варианты не переносим: они бьют типом урона Ion, которого у нас нет,
#    а добавление 15-го типа урона сделало бы их игнорирующими всю существующую броню;
#  - у базы убран BatteryAmmoProvider с proto: SmallRedLaser — такого прототипа нет
#    даже у губов, а каждая конкретная ячейка всё равно задаёт свой снаряд.

- type: entity
  id: BaseMilitaryPowerCell
  abstract: true
  parent: BaseItem
  components:
  - type: Item
  - type: Battery
    pricePerJoule: 0.15
  - type: BatteryDrinkerSource
  - type: PowerCell
  - type: Explosive
    explosionType: Default
    maxIntensity: 200
    intensitySlope: 1.5
  - type: Sprite
    sprite: Objects/Power/power_cells.rsi
  - type: SolutionContainerManager
    solutions:
      battery:
        maxVol: 5
  - type: InjectableSolution
    solution: battery
  - type: DrawableSolution
    solution: battery
  - type: Appearance
  - type: Riggable
  - type: PhysicalComposition
    materialComposition:
      Steel: 80
      Gold: 40
      Glass: 40
      Plasma: 40
    chemicalComposition:
      Zinc: 7.5

# ── Ячейки для ПП ──

- type: entity
  id: BaseMilitaryPowerCellSMG
  abstract: true
  parent: BaseMilitaryPowerCell
  components:
  - type: Sprite
    layers:
    - map: [ "enum.PowerCellVisualLayers.Base" ]
      state: icon
    - map: [ "enum.PowerCellVisualLayers.Unshaded" ]
      state: o4
      shader: unshaded
  - type: Battery
    maxCharge: 1000
    startingCharge: 1000
  - type: BatteryDrinkerSource
    maxAmount: 200
  - type: Tag
    tags:
    - MilitaryPowerCellSMG
    - MilitaryPowerCell

- type: entity
  name: ячейка для ПП
  description: Боевая энергоячейка под лазерное оружие класса пистолета-пулемёта.
  id: PowerCellIRSMG
  suffix: Full
  parent: BaseMilitaryPowerCellSMG
  components:
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_pistol_lethal.rsi
  - type: BatteryAmmoProvider
    proto: SMGLaser
    fireCost: 50

- type: entity
  name: блюспейс-ячейка для ПП
  description: Боевая энергоячейка под ПП, разгоняющая калиброванные блюспейс-частицы. Заряд ёмче обычного, а луч бьёт заметно больнее.
  id: PowerCellBluespaceSMG
  suffix: Full
  parent: BaseMilitaryPowerCellSMG
  components:
  - type: Battery
    maxCharge: 1500
    startingCharge: 1500
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_pistol_bluespace.rsi
  - type: BatteryAmmoProvider
    proto: SMGLaserBluespace
    fireCost: 50

