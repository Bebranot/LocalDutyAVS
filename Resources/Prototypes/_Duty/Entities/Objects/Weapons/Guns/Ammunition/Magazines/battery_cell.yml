    size: Tiny
  - type: Sprite
    sprite: _Duty/Objects/Weapons/Guns/Ammunition/Magazine/energy_cell_revolver.rsi
  - type: Battery
    maxCharge: 500
    startingCharge: 500
  - type: BatteryDrinkerSource
    maxAmount: 100
  - type: Tag
    tags:
    - MilitaryPowerCellRevolver
    - MilitaryPowerCell
  - type: PhysicalComposition
    materialComposition:
      Steel: 40
      Gold: 20
      Glass: 20
      Plasma: 20
    chemicalComposition:
      Zinc: 5

- type: entity
  name: револьверная ячейка
  description: Боевая энергоячейка под лазерные револьверы.
  id: PowerCellIRRevolver
  suffix: Full
  parent: BaseMilitaryPowerCellRevolver
  components:
  - type: Sprite
    layers:
    - map: [ "base" ]
      state: lethal_charge
      shader: unshaded
  - type: GenericVisualizer
    visuals:
      enum.AmmoVisuals.HasAmmo:
        base:
          True:
            state: lethal_charge
            shader: unshaded
          False:
            state: lethal
            shader: null
  - type: BatteryAmmoProvider
    proto: RevolverRedLaser
    fireCost: 62.5

- type: entity
  name: блюспейс-ячейка револьверная
  description: Боевая энергоячейка под револьвер, разгоняющая калиброванные блюспейс-частицы. Заряд ёмче обычного, а луч бьёт заметно больнее.
