# Родитель — ClothingHeadHelmetArmoredBase, а НЕ ClothingHeadHelmetBasic: последний получил
# ADT-твиком складное забрало (слои icon + icon-open, Foldable, FoldableClothing). У короны
# такого арта нет и по смыслу не нужно, а объявленный слой icon-open заставлял клиент писать
# в лог «State 'icon-open' not found in RSI» и ронял YAML-линтер.
- type: entity
  parent: [ClothingHeadHelmetArmoredBase, BaseMajorContraband]
  id: ClothingHeadHelmetSQcrown
  name: Sledge queen`s crown
  description: Queen`s crown. It`s blocking damage for all head. Don`t ask why.
  suffix: Duty, Броня
  components:
  - type: Sprite
    sprite: _Duty/Clothing/SQA/Helmet.rsi
  - type: Clothing
    sprite: _Duty/Clothing/SQA/Helmet.rsi
  - type: Armor
    coverage:
    - Head
    traumaDeductions:
      Dismemberment: 0.3
      OrganDamage: 0.3
      BoneDamage: 0.3
      VeinsDamage: 0
      NerveDamage: 0
    modifiers:
      coefficients:
        Blunt: 0.35
        Slash: 0.35
        Piercing: 0.35
        Heat: 0.35
        Radiation: 0.75
        Caustic: 0.75
  - type: ExplosionResistance
    damageCoefficient: 0.3
