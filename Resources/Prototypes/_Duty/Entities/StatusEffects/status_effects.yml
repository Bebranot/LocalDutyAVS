# Duty: Кратковременное обездвиживание после выхода из прицеливания лёжа (AimingComponent).
# Наследуется от ванильного StatusEffectSlowdown (Resources/Prototypes/Entities/StatusEffects/movement.yml).

- type: entity
  parent: StatusEffectSlowdown
  id: AimRecoveryImmobilizeStatusEffect
  suffix: Duty, Статус-эффект
  name: aim recovery immobilize

# Duty: Замедление при попадании алебардой ОСЩ во время рывка.
# Персонаж не падает (не KnockedDown), но замедляется на N секунд.
# Наследуется от ванильного StatusEffectSlowdown (Resources/Prototypes/Entities/StatusEffects/movement.yml).

- type: entity
  parent: StatusEffectSlowdown
  id: HalberdChargeHitSlowdownStatusEffect
  suffix: Duty, Статус-эффект
  name: hit by halberd charge slowdown

# Duty: Замедление после срабатывания эффекта Лазаруса ("Last Standing").
# Персонаж не падает, но временно медлителен — тело ещё не отошло от шока.
# Наследуется от ванильного StatusEffectSlowdown (Resources/Prototypes/Entities/StatusEffects/movement.yml).

- type: entity
  parent: StatusEffectSlowdown
  id: DutyLazarusSlowdownStatusEffect
  suffix: Duty, Статус-эффект
  name: lazarus aftershock slowdown

# Duty: Замедление на время удержания двуручного блока (TwoHandedBlockSystem).
# Персонаж не падает, но замедляется на 50% на время окна блока (0.3с).
# Наследуется от ванильного StatusEffectSlowdown (Resources/Prototypes/Entities/StatusEffects/movement.yml).

- type: entity
  parent: StatusEffectSlowdown
  id: DutyTwoHandedBlockSlowdownStatusEffect
  suffix: Duty, Статус-эффект
  name: two-handed block slowdown
