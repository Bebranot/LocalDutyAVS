# _Duty: портировано из Space Onyx. Урезано относительно оригинала — убраны CollectiveMind,
# Wires/WiresPanel, LanguageSpeaker/LanguageKnowledge и DatasetVocalizer(SlotMachineAds):
# этих систем (или нужного датасета) в нашем форке ещё нет. Не наследуем от нашего же
# BaseSlotMachine — он уже несёт компонент SlotMachine (другая игра), конфликтующий с CoinFlipper.
- type: entity
  id: CoinFlipper
  parent: BaseMachine
  name: флип-машина
  description: Орёл и Решка для асоциальных личностей.
  components:
  - type: StationAiWhitelist
  - type: Sprite
    sprite: _Duty/Structures/Machines/Gambling/coinflipper.rsi
    layers:
    - state: Coinflipper
  - type: Appearance
  - type: AmbientOnPowered
  - type: AmbientSound
    volume: -9
    range: 3
    enabled: false
    sound:
      path: /Audio/Ambience/Objects/vending_machine_hum.ogg
  - type: Electrified
    enabled: false
    usesApcPower: true
  - type: PointLight
    enabled: false
    castShadows: false
    radius: 2
    energy: 1.5
    mask: /Textures/Effects/LightMasks/cone.png
    autoRot: true
  - type: LitOnPowered
  - type: ApcPowerReceiver
    powerLoad: 200
  - type: Repairable
    doAfterDelay: 8
  - type: Anchorable
  - type: TypingIndicator
    proto: robot
  - type: Speech
    speechVerb: Robotic
    speechSounds: Vending
  - type: SentienceTarget
    flavorKind: station-event-random-sentience-flavor-mechanical
    weight: 0.125
  - type: StaticPrice
    price: 100
  - type: ContainerContainer
    containers:
      money: !type:ContainerSlot
        showEnts: false
        occludes: true
        ent: null
  - type: ItemSlots
    slots:
      money:
        name: spesos
        whitelist:
          components:
          - Cash
  - type: CoinFlipper
  - type: DoAfter
