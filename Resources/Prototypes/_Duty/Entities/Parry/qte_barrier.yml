# Duty: невидимый барьер вокруг участников QTE-дуэли.
#
# HumanoidBlockLayer = HighImpassable | MidImpassable — мобы в него упираются (их маска
# содержит оба флага), но у снарядов маска Impassable | BulletImpassable, а у хитскана Opaque,
# и ни одного из этих флагов здесь нет. Поэтому барьер не пускает посторонних вплотную,
# но остаётся прозрачным для дальнобойного оружия — только им и можно прервать сцену.
#
# Спавнится и удаляется исключительно QteDuelSystem; TimedDespawn — страховка на случай,
# если сцена оборвётся аварийно и барьер осиротеет.

- type: entity
  id: DutyQteBarrier
  name: qte barrier
  suffix: Duty, QTE
  categories: [ HideSpawnMenu ]
  components:
  - type: Transform
    anchored: true
    noRot: true
  - type: Physics
    bodyType: Static
    canCollide: true
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.5,-0.5,0.5,0.5"
        density: 1000
        mask:
        - FullTileMask
        layer:
        - HumanoidBlockLayer
  - type: TimedDespawn
    lifetime: 60
