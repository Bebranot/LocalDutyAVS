# _Duty: водоёмы Сталкера. Наследуются от стандартной воды (FloorWaterEntity), а не копируют её:
# так они получают всё, что умеет обычная вода, — тушение горящих (TileEntityEffect: Extinguish),
# замедление, слой для скольжения, рыбалку ADT, набор ведром, — и не отстают от апстрима.
# Раньше здесь была ручная копия с TileEntityEffect без effects: сущность падала при создании
# (NullNotAllowed), а шаг по ней кидал бы исключение. Здесь меняем только то, что отличает Зону.
- type: entity
  id: STFloorWaterEntityDuty
  parent: FloorWaterEntity
  abstract: true
  name: water
  description: Murky water of the Zone.
  placement:
    mode: SnapgridCenter
    snap:
    - Wall
  components:
  - type: Sprite
    sprite: _Stalker/Tiles/water.rsi
    drawdepth: BelowFloor
    layers:
      - state: water1
  # Неиссякаемый водоём, как у обычной воды, но налит мутной водой Зоны.
  - type: SolutionContainerManager
    solutions:
      pool:
        maxVol: 9999999
        reagents:
        - ReagentId: STToxicWater
          Quantity: 9999999
  # У базовой воды регенерация смотрит в несуществующий раствор tank — здесь указываем pool,
  # чтобы вычерпанное действительно восполнялось.
  - type: SolutionRegeneration
    solution: pool
    generated:
      reagents:
      - ReagentId: STToxicWater
        Quantity: 100
  # По мелководью Зоны идти легче, чем по станционному бассейну.
  - type: SpeedModifierContacts
    walkSpeedModifier: 0.8
    sprintSpeedModifier: 0.8
  - type: FootstepModifier
    footstepSoundCollection:
      collection: STFootstepWater
      params:
        volume: 8

- type: entity
  parent: STFloorWaterEntityDuty
  id: FloorWaterEntityStalker1Duty
  suffix: Stalker
  placement:
    mode: SnapgridCenter
    snap:
    - Wall

