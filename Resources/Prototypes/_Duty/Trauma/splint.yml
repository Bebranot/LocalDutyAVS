# _Duty: шина для лечения переломов (FractureTreatmentSystem). Крафтится из 2 досок + 1 ткани
# (15с); сам предмет — расходник, тратится при попытке шинирования (успех или провал — не важно).

- type: entity
  parent: BaseItem
  id: DutySplint
  name: splint
  description: A pair of wooden slats bound together with cloth. Used to stabilize a fracture.
  components:
    - type: Tag
      tags:
        - Splint
    - type: Sprite
      sprite: _Duty/Objects/Items/Makeshift_Health/improvised_splint.rsi
      state: icon
    - type: Item
      # У самодельной рси нет отдельных инхенд-состояний (только icon) — не задаём
      # Item.sprite, иначе движок искал бы несуществующие "inhand-*" состояния там же.
      size: Small

- type: constructionGraph
  id: DutySplint
  start: start
  graph:
    - node: start
      edges:
        - to: splint
          steps:
            - material: WoodPlank
              amount: 2
              doAfter: 8
            - material: Cloth
              amount: 1
              doAfter: 7
    - node: splint
      entity: DutySplint

- type: construction
  id: DutySplint
  graph: DutySplint
  startNode: start
  targetNode: splint
  category: construction-category-tools
  objectType: Item
