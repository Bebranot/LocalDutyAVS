# Графы крафта самодельного Т-90М. doAfter в секундах; сумма по графам — в отчёте.
# SetAnchor перед последним узлом: стапель стоит на анкере, и без этого готовая деталь (и сам танк) осталась бы прикрученной.

- type: constructionGraph
  id: DutyTankWorkshopGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: Steel
        amount: 10
        doAfter: 4
      - material: MetalRod
        amount: 5
        doAfter: 3
  - node: frame
    entity: DutyTankWorkshopFrame
    edges:
    - to: workshop
      steps:
      - tool: Welding
        doAfter: 6
      - tag: ADTMicroManipulatorStockPart
        name: duty-tank-step-motor
        icon:
          sprite: Objects/Misc/stock_parts.rsi
          state: micro_mani
        doAfter: 3
      - material: Cable
        amount: 5
        doAfter: 3
      - tool: Screwing
        doAfter: 4
  - node: workshop
    entity: DutyTankWorkshop

- type: constructionGraph
  id: DutyT90EngineGraph
  start: start
  graph:
  - node: start
    edges:
    - to: stand
      steps:
      - material: Steel
        amount: 10
        doAfter: 4
      - material: MetalRod
        amount: 4
        doAfter: 2
  - node: stand
    entity: DutyT90EngineStand
    edges:
    - to: engine
      completed:
      - !type:SetAnchor
        value: false
      steps:
      - tag: DutyT90CylinderBlock
        name: duty-tank-step-cylinder-block
        icon:
          sprite: Objects/Materials/Scrap/generic.rsi
          state: junk-firelock-1
        doAfter: 6
      - tag: DutyT90Turbocharger
        name: duty-tank-step-turbocharger
        icon:
          sprite: Objects/Materials/Scrap/generic.rsi
          state: junk-fireextinguisher
        doAfter: 4
      - tag: DutyT90FuelPump
        name: duty-tank-step-fuel-pump
        icon:
          sprite: Objects/Materials/Scrap/generic.rsi
          state: junk-camera
        doAfter: 4
      - tag: DutyT90Gearbox
        name: duty-tank-step-gearbox
        icon:
          sprite: Objects/Materials/Scrap/generic.rsi
          state: junk-firelock-2
        doAfter: 6
      - tool: Anchoring
        doAfter: 8
  - node: engine
    entity: DutyT90MEngine

- type: constructionGraph
  id: DutyT90HullGraph
  start: start
  graph:
  - node: start
    edges:
    - to: frame
      steps:
      - material: Steel
        amount: 10
        doAfter: 4
      - material: DutyArmorSteel
        amount: 4
        doAfter: 4
  - node: frame
    entity: DutyT90HullFrame
    edges:
    - to: bottom
      steps:
      - material: DutyArmorSteel
        amount: 4
        doAfter: 4
      - tool: Welding
        doAfter: 6
  - node: bottom
    entity: DutyT90HullBottom
    edges:
    - to: sides
      steps:
      - material: DutyArmorSteel
        amount: 6
        doAfter: 5
      - tool: Welding
        doAfter: 8
  - node: sides
    entity: DutyT90HullSides
    edges:
    - to: glacis
      steps:
      - material: DutyArmorSteel
        amount: 4
        doAfter: 4
      - tool: Welding
        doAfter: 6
  - node: glacis
    entity: DutyT90HullGlacis
    edges:
    - to: roof
      steps:
      - material: DutyArmorSteel
        amount: 4
        doAfter: 4
      - tool: Welding
        doAfter: 6
  - node: roof
    entity: DutyT90HullRoof
    edges:
    - to: hull
      completed:
      - !type:SetAnchor
        value: false
      steps:
      - tag: DutyT90Engine
        name: duty-tank-step-engine
        icon:
          sprite: Objects/Materials/Scrap/generic.rsi
          state: junk-canister-2
        doAfter: 10
      - tool: Anchoring
        doAfter: 8
      - material: Cable
        amount: 10
        doAfter: 4
      - tool: Screwing
        doAfter: 5
      - tool: Welding
        doAfter: 4
  - node: hull
    entity: DutyVehicleT90M

