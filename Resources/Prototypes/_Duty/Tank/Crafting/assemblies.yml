# Промежуточные узлы графов крафта самодельного Т-90М: стенды и недостроенные корпуса.
# Стоят на месте (анкерованы), снимаются гаечным ключом; визуал временный (шасси Рипли).

- type: entity
  abstract: true
  parent: BaseMachine
  id: DutyTankAssemblyBase
  components:
  - type: Sprite
    sprite: Objects/Specific/Mech/ripley_construction.rsi
    state: ripley_chassis
    color: "#7a7260"
  - type: Damageable
    damageModifierSet: Metallic
  - type: Injurable
    damageContainer: StructuralInorganic
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 400
      behaviors:
      - !type:PlaySoundBehavior
        sound:
          collection: MetalBreak
      - !type:DoActsBehavior
        acts: [ "Destruction" ]
      - !type:SpawnEntitiesBehavior
        spawn:
          SheetSteel1:
            min: 2
            max: 6

- type: entity
  parent: DutyTankAssemblyBase
  id: DutyTankWorkshopFrame
  name: workshop frame
  description: An unfinished stage of an improvised tank assembly.
  components:
  - type: Sprite
    state: ripley_chassis
  - type: Construction
    graph: DutyTankWorkshopGraph
    node: frame

