# Детали самодельного Т-90М, печатаются на станке DutyTankWorkshop.
# Тяжёлые узлы: Huge/Ginormous, двуручные, замедляют носильщика; проще тянуть (pull).

- type: entity
  abstract: true
  parent: BaseItem
  id: DutyT90PartBase
  components:
  - type: Sprite
    sprite: _Duty/Tank/parts.rsi
    state: scrap_pile
  - type: Item
    size: Large

- type: entity
  parent: DutyT90PartBase
  id: DutyT90CylinderBlock
  name: V-92 cylinder block
  description: Part of an improvised T-90M tank.
  components:
  - type: Sprite
    sprite: _Duty/Tank/parts.rsi
    state: engine
  - type: Item
    size: Huge
  - type: MultiHandedItem
  - type: ClothingSpeedModifier
    walkModifier: 0.6
    sprintModifier: 0.6
  - type: HeldSpeedModifier
  - type: Tag
    tags:
    - DutyT90CylinderBlock

