# Спаренный ПКТМ 7.62: патрон — наш ванильный .30 (CartridgeLightRifle), лента 250
- type: entity
  parent: DutyHardpointT90Base
  id: DutyHardpointT90PKT
  name: PKTM coaxial machine gun
  description: A 7.62 mm machine gun coaxial with the main gun.
  components:
  - type: Sprite
    state: t60p3m
  - type: HardpointItem
    hardpointType: HardpointTypeLauncher
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeLauncher
    damageMultiplier: 0.15
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 250
  - type: VehicleTurretAttachment
  - type: VehicleTurret
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    offsetRotatesWithTurret: true
    # спарен с пушкой и спрятан в маске: своего оверлея нет
    pixelOffset: "4,-24"
  - type: Gun
    fireRate: 10
    projectileSpeed: 45
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      collection: DutyT90PKTFire
    cameraRecoilScalar: 0
  - type: BallisticAmmoProvider
    cycleable: false
    proto: CartridgeLightRifle
    capacity: 250
  - type: VehicleHardpointAmmo
    startEmpty: true
    magazineSize: 250
    maxStoredMagazines: 1
  - type: RefillableByBulletBox
    bulletType: DutyMagazineBelt762Tank

# Дистанционный Корд 12.7 на крыше, им управляет командир
- type: entity
  parent: DutyHardpointT90Base
  id: DutyHardpointT90Kord
  name: Kord remote weapon station
  description: A remotely operated 12.7 mm Kord heavy machine gun on the turret roof.
  components:
  - type: Construction
    graph: DutyT90KordGraph
    node: kord
  - type: Sprite
    state: t60p3m
  - type: HardpointItem
    hardpointType: HardpointTypeSecondary
    vehicleFamily: HardpointVehicleFamilyTank
    damageMultiplier: 0.15
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 200
  - type: VehicleTurret
    # дистанционная станция крутится сама за курсором, независимо от башни
    rotateToCursor: true
    stabilizedRotation: true
    rotationSpeed: 90
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    offsetRotatesWithTurret: false
    useDirectionalOffsets: true
    pixelOffsetNorth: "0,-10"
    pixelOffsetEast: "-10,0"
    pixelOffsetSouth: "0,10"
    pixelOffsetWest: "10,0"
    showOverlay: true
    overlayRsi: _Duty/Tank/t90m.rsi
    overlayState: t60p3m_0
    overlayDamagedState: t60p3m_1
  - type: HardpointVisual
    vehicleState: t60p3m_0
    damagedVehicleState: t60p3m_1
  - type: Gun
    fireRate: 8
    projectileSpeed: 50
    selectedMode: FullAuto
    availableModes:
    - FullAuto
    soundGunshot:
      collection: DutyT90KordFire
    cameraRecoilScalar: 0
  - type: BallisticAmmoProvider
    cycleable: false
    proto: DutyTankRound127
    capacity: 150
  - type: VehicleHardpointAmmo
    startEmpty: true
    magazineSize: 150
    maxStoredMagazines: 1
  - type: RefillableByBulletBox
    bulletType: DutyMagazineBelt127Tank
