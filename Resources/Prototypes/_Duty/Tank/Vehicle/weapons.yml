# Кумулятивный, 6 выстрелов (8+8+6 = 22 в автомате заряжания)
- type: entity
  parent: DutyHardpointT90CannonBase
  id: DutyHardpointT90CannonHEAT
  name: 2A46M-5 gun (HEAT)
  components:
  - type: Sprite
    state: railgun
  - type: VehicleTurret
    fireWhileRotatingGraceDegrees: 180
