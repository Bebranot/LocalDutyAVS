# Оружие Т-90М (хардпоинты башни и дистанционная станция Корд).
# Основа — пушка/спарка SPP-танка RMC. Выкинуто (компонентов у нас нет): GunFireArc, GunMuzzleOffset,
# GunUseGunOrigin, GunIgnoreContainerOwnerCollision (точку вылета и цель теперь даёт DutyGunAimEvent
# в башне), GunIFF/UserIFF, RMCWeaponAccuracy, PowerLoaderGrabbable.

- type: soundCollection
  id: DutyT90CannonFire
  files:
  - /Audio/_Duty/T90M/Weapons/cannon_fire_close_1.ogg
  - /Audio/_Duty/T90M/Weapons/cannon_fire_close_2.ogg
  - /Audio/_Duty/T90M/Weapons/cannon_fire_close_3.ogg

- type: soundCollection
  id: DutyT90PKTFire
  files:
  - /Audio/_Duty/T90M/Weapons/pkt_shot_1.ogg
  - /Audio/_Duty/T90M/Weapons/pkt_shot_2.ogg

- type: soundCollection
  id: DutyT90KordFire
  files:
  - /Audio/_Duty/T90M/Weapons/kord_shot_1.ogg
  - /Audio/_Duty/T90M/Weapons/kord_shot_2.ogg

- type: entity
  abstract: true
  parent: BaseItem
  id: DutyHardpointT90Base
  components:
  - type: Sprite
    sprite: _Duty/Tank/RMC/Structures/Vehicles/hardpoints/spptank.rsi
  - type: Item
    size: Huge
  - type: MultiHandedItem

# Общая часть орудий башни (пушка 2А46М-5 в трёх исполнениях по типу снаряда)
- type: entity
  abstract: true
  parent: DutyHardpointT90Base
  id: DutyHardpointT90CannonBase
  name: 2A46M-5 125 mm gun
  description: A 125 mm smoothbore tank gun fed from the autoloader.
  components:
  - type: HardpointItem
    hardpointType: HardpointTypeCannon
    vehicleFamily: HardpointVehicleFamilyTank
    slotType: HardpointSlotTypeCannon
    damageMultiplier: 0.15
    repairRate: 0.01
  - type: HardpointIntegrity
    maxIntegrity: 500
  - type: VehicleTurretAttachment
  - type: ShootAtFixedPoint
  - type: Gun
    fireRate: 0.2
    projectileSpeed: 60
    selectedMode: SemiAuto
    availableModes:
    - SemiAuto
    soundGunshot:
      collection: DutyT90CannonFire
    soundEmpty:
      path: /Audio/_Duty/T90M/Turret/gun_jammed.ogg
    cameraRecoilScalar: 0
  - type: BallisticAmmoProvider
    cycleable: false
    soundRack:
      path: /Audio/_Duty/T90M/Turret/autoloader_ram.ogg
    soundInsert:
      path: /Audio/_Duty/T90M/Turret/autoloader_carousel.ogg

# Основная: бронебойный, 8 выстрелов в карусели автомата заряжания
- type: entity
  parent: DutyHardpointT90CannonBase
  id: DutyHardpointT90CannonAPFSDS
  name: 2A46M-5 gun (APFSDS)
  components:
  - type: Sprite
    state: railgun
  - type: VehicleTurret
    fireWhileRotatingGraceDegrees: 180
    useBarrelDirectionForShots: true
    offsetRotatesWithTurret: true
    # ствол нарисован на самой башне, смещение — срез дула (вперёд = -Y)
    pixelOffset: "0,-52"
  - type: BallisticAmmoProvider
    proto: DutyTankRound125APFSDS
    capacity: 8
  - type: VehicleHardpointAmmo
    startEmpty: true
    magazineSize: 8
    maxStoredMagazines: 1
  - type: RefillableByBulletBox
    bulletType: DutyCartridge125APFSDS

# Осколочно-фугасный, 8 выстрелов (тот же ствол, другой тип снаряда в карусели)
- type: entity
  parent: DutyHardpointT90CannonBase
  id: DutyHardpointT90CannonHEFrag
  name: 2A46M-5 gun (HE-Frag)
