# _Duty: приоритеты звука для DutyMusicDirector.
# Пока играет ГЛОБАЛЬНЫЙ звук из этого списка, динамическая музыка (приоритет 0) молчит.
# Позиционный эмбиент комнат сюда не попадает — арбитр смотрит только на глобальные потоки.
# pathPrefixes сравнивается по началу строки, поэтому годится и папка, и полный путь к файлу.

- type: dutyMusicPriority
  id: DutyMusicCodeAlpha
  priority: 100
  holdAfter: 3
  pathPrefixes:
    - /Audio/_Duty/CodeAlpha/

- type: dutyMusicPriority
  id: DutyMusicAnnouncements
  priority: 50
  holdAfter: 2
  pathPrefixes:
    - /Audio/_Duty/Announcement/
    - /Audio/ADT/Announcements/
    - /Audio/Announcements/

# Лавалендский и пещерный эмбиент — коллекция AmbienceMining.
#
# Пофайлового списка здесь намеренно НЕТ. Путь к файлу — плохой ключ: ambiruin*.ogg лежит
# одновременно в лавалендской AmbienceMining, в морговой AmbienceSpooky (11 из 14 файлов
# AmbienceSpookyFog — тоже они), и по пути их не различить. Список глушил бы музыку у морга.
#
# Вместо этого правило сужено тем же предикатом, которым ваниль выбирает лавалендский эмбиент:
# OnMapGrid истинно, только когда грид под игроком И ЕСТЬ карта, то есть на планете. На станции
# грид — отдельная сущность от карты, поэтому там правило не применяется вовсе, и папку целиком
# можно брать безопасно: ambigen*/ambimaint* станции под этот предикат не попадают.
- type: dutyMusicPriority
  id: DutyMusicLavalandAmbience
  priority: 20
  holdAfter: 2
  rules: OnMapGrid
  pathPrefixes:
    - /Audio/Ambience/
