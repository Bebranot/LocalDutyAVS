# Боеприпасы 12.7x55 (АШ-12 / РШ-12) — порт из STALKER-14.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: Bullet1255PS12A
  name: bullet (12.7x55)
  parent: STBaseHRBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 4
  - type: Projectile
    damage:
      types:
        Piercing: 34
        Blunt: 2
        Slash: 2
  - type: StaminaDamageOnCollide
    damage: 10
  - type: DutyBallistics
    armorPenetration: 0.35
    arteryBonus: 0.02
    fractureChance: 0.025

- type: entity
  id: Bullet1255BP
  name: bullet (12.7x55 AP)
  parent: Bullet1255PS12A
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 31
  - type: DutyBallistics
    armorPenetration: 0.65
    arteryBonus: 0.02
    fractureChance: 0.025

- type: entity
  id: Bullet1255HP
  name: bullet (12.7x55 HP)
  parent: Bullet1255PS12A
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 26
        Slash: 10
        Blunt: 3
  - type: DutyBallistics
    arteryBonus: 0.04

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  id: BaseSTCartridge1255
  name: cartridge (12,7x55)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - STCartridge1255
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: STCartridge1255PS12A
  name: cartridge (12.7x55)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge1255
  components:
  - type: CartridgeAmmo
    proto: Bullet1255PS12A

- type: entity
  id: STCartridge1255BP
  name: cartridge (12.7x55 AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge1255
  components:
  - type: CartridgeAmmo
    proto: Bullet1255BP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: STCartridge1255HP
  name: cartridge (12.7x55 HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge1255
  components:
  - type: CartridgeAmmo
    proto: Bullet1255HP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Магазины ─────────────────────────────────────────────────────────────────
- type: entity
  id: AS12Mag
  name: магазин АШ-12 (20)
  description: Магазин 12,7x55 для АШ-12. Вместимость 20.
  parent: BaseItem
  suffix: "Stalker, STWeapon, Огнестрел"
  components:
  - type: Tag
    tags:
    - MagazineAS12
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge1255PS12A
    whitelist:
      tags:
      - STCartridge1255
    capacity: 20
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/919/pp-91.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
