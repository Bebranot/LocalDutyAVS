# Боеприпасы 12.7x108 (ОСВ-96) — порт из STALKER-14. Mutant→Piercing.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: Bullet13x108FMJ
  name: bullet (12.7x108)
  parent: STBaseHRBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Piercing: 60
  - type: StaminaDamageOnCollide
    damage: 20
  - type: DutyBallistics
    armorPenetration: 0.6
    arteryBonus: 0.03
    fractureChance: 0.03

- type: entity
  id: Bullet13x108PC
  name: bullet (12.7x108 AP)
  parent: Bullet13x108FMJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 54
  - type: DutyBallistics
    armorPenetration: 0.85
    arteryBonus: 0.03
    fractureChance: 0.03

- type: entity
  id: Bullet13x108HPBT
  name: bullet (12.7x108 HP)
  parent: Bullet13x108FMJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 45
        Slash: 18
        Blunt: 4
  - type: DutyBallistics
    armorPenetration: 0.25
    arteryBonus: 0.05

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  id: BaseSTCartridge13x108
  name: cartridge (12,7x108)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - STCartridge13x108
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: STCartridge13x108FMJ
  name: cartridge (12.7x108)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge13x108
  components:
  - type: CartridgeAmmo
    proto: Bullet13x108FMJ

- type: entity
  id: STCartridge13x108PC
  name: cartridge (12.7x108 AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge13x108
  components:
  - type: CartridgeAmmo
    proto: Bullet13x108PC
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: STCartridge13x108HPBT
  name: cartridge (12.7x108 HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge13x108
  components:
  - type: CartridgeAmmo
    proto: Bullet13x108HPBT
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Магазины ─────────────────────────────────────────────────────────────────
- type: entity
  id: 13x108Mag10
  name: магазин 12,7x108 (10)
  description: Магазин 12,7x108 для ОСВ-96. Вместимость 10.
  parent: BaseItem
  suffix: "Stalker, STWeapon, Огнестрел"
  components:
  - type: Tag
    tags:
    - Magazine13x108
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge13x108FMJ
    whitelist:
      tags:
      - STCartridge13x108
    capacity: 10
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/13108.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance
