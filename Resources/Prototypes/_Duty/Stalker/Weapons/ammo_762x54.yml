# Боеприпасы 7.62x54R — порт из STALKER-14. Mutant→Piercing.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: Bullet754FMJ
  name: bullet (7.62x54R)
  parent: STBaseHRBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 10
  - type: Projectile
    damage:
      types:
        Piercing: 30
  - type: StaminaDamageOnCollide
    damage: 6
  - type: DutyBallistics
    armorPenetration: 0.3
    arteryBonus: 0.02
    fractureChance: 0.015

- type: entity
  id: Bullet754SNB
  name: bullet (7.62x54R AP)
  parent: Bullet754FMJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 27
  - type: DutyBallistics
    armorPenetration: 0.6
    arteryBonus: 0.02
    fractureChance: 0.015

- type: entity
  id: Bullet754HPBT
  name: bullet (7.62x54R HP)
  parent: Bullet754FMJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 22
        Slash: 9
        Blunt: 3
  - type: DutyBallistics
    armorPenetration: -0.05
    arteryBonus: 0.04

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  id: BaseSTCartridge754
  name: cartridge (7,62x54)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - STCartridge754
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: STCartridge754FMJ
  name: cartridge (7.62x54R)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge754
  components:
  - type: CartridgeAmmo
    proto: Bullet754FMJ

- type: entity
  id: STCartridge754SNB
  name: cartridge (7.62x54R AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge754
  components:
  - type: CartridgeAmmo
    proto: Bullet754SNB
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: STCartridge754HPBT
  name: cartridge (7.62x54R HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseSTCartridge754
  components:
  - type: CartridgeAmmo
    proto: Bullet754HPBT
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Магазины ─────────────────────────────────────────────────────────────────
- type: entity
  id: Base754Mag5
  name: магазин 7,62x54 (5)
  description: Магазин 7,62x54 для винтовок. Вместимость 5.
  parent: BaseItem
  suffix: "Stalker, STWeapon, Огнестрел"
  components:
  - type: Tag
    tags:
    - Magazine754
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge754FMJ
    whitelist:
      tags:
      - STCartridge754
    capacity: 5
  - type: Item
    size: Small
    shape:
    - 0,0,0,0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/754/svd5.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

