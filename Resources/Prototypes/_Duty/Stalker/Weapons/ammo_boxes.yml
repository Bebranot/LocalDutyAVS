# Коробки патронов россыпью (сталкерские калибры) — спрайты из портированного _Stalker/AmmoBoxes.rsi.
# Работают как BallisticAmmoProvider (аналог ванильных MagazineBoxPistol/BoxLethalshot) — оттуда патрон
# достаётся по одному прямо в оружие/магазин.
# На каждый калибр три коробки: обычная (печатается сразу) и бронебойная/экспансивная (открываются
# технологиями, см. Resources/Prototypes/_Duty/Research/security_ammo.yml). Бронебойные и экспансивные
# отличаются наложенной полосой из того же атласа: красная (antiarmor) и жёлтая (exp).
# .44 Magnum и 12.7x55 своих коробок в атласе не имеют: .44 — зелёная пистолетная коробка «45(2)»,
# 12.7x55 — военный цинк «cink» (не «1270»: это ящик дробовых патронов).

- type: entity
  parent: BaseItem
  id: STAmmoBox545
  name: коробка патронов (5.45x39)
  suffix: "Stalker, Коробка патронов, 5.45x39"
  description: Картонная коробка патронов калибра 5.45x39. Вместимость — 60 штук.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - STCartridge545
    proto: STCartridge545FMJ
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/AmmoBoxes.rsi
    state: "545"
  - type: Tag
    tags:
    - AmmoBox
