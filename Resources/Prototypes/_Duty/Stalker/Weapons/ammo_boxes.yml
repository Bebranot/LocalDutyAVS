# Коробки патронов россыпью (сталкерские калибры) — используют готовые, но ранее нигде не
# подключённые спрайты из портированного _Stalker/AmmoBoxes.rsi. По одной общей коробке на
# калибр (без деления по типу пули — арт для этого есть только у 9x39, разводить неоднородность
# ради одного калибра не стали). Работают как BallisticAmmoProvider (аналог ванильных
# MagazineBoxPistol/BoxLethalshot) — оттуда патрон достаётся по одному прямо в оружие/магазин.
# АШ-12 (12.7x55) в списке нет: среди готового арта нет коробки, которую можно уверенно
# отнести к этому калибру ("1270"-кластер по виду — деревянный ящик дробовых патронов
# незнакомого калибра, не наш STCartridge1255), лучше пропустить, чем повесить неверную иконку.

- type: entity
  parent: BaseItem
  id: STAmmoBox545
  name: коробка патронов (5.45x39)
  suffix: "Stalker, Коробка патронов, 5.45x39"
  description: Картонная коробка патронов калибра 5.45x39. Вместимость — 60 штук.
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    whitelist:
      tags:
      - STCartridge545
    proto: STCartridge545FMJ
    capacity: 60
  - type: Item
    size: Small
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/AmmoBoxes.rsi
    state: "545"
  - type: Tag
    tags:
    - AmmoBox
    - StalkerAmmoBox

