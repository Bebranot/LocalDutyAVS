# Рецепты автолата на сталкерские магазины и коробки патронов — печатаются в SecurityTechFab
# рядом с ванильными (см. staticPacks: StalkerAmmoStatic в Entities/Structures/Machines/lathe.yml).
#
# Баланс магазинов калибруется по ванильному MagazineRifle (тот самый магазин, что уже лежит
# в GunSafeRifleLecter) — Lead: 475 за 25 патронов, т.е. 19 Lead/патрон, без Steel. Это ставка
# "обычного" магазина (parent: BaseAmmoRecipe, категория "Ammo" из базы).
# "Большой"/барабанный магазин (второй вариант там, где он существует у ствола) — на 30% дороже
# по Lead за патрон плюс Steel: 2/патрон (механика барабана сложнее просто пропорции патронов).
# Крохотные штатные магазины на 5-10 патронов (Base*Mag10, Base754Mag5) сюда не идут —
# их и так выдаёт сам ствол при спавне, печатать смысла нет.
#
# Коробки патронов — по ставке ванильного MagazineBoxPistol (Steel 300 / Lead 600 за 60 шт.).

