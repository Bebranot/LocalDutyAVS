# Кейсы под сталкерские револьверы. Патронами в барабан не заряжаются магазином — вместо
# "2 магазинов" кладём 2 спидлоадера (там, где они есть) или стопку патронов (Штурмовой RH12,
# у которого спидлоадера в прототипах нет). Матеба "Джокер" — реskин Матебы, свой кейс не получает.

- type: entity
  parent: STBaseWeaponCase
  id: STWeaponRevolverChiappaRhino60DSCase
  name: кейс с Chiappa Rhino 60DS
  suffix: "Stalker, Кейс, Chiappa Rhino 60DS"
  description: Кейс с оружием «Chiappa Rhino 60DS» и 2 спидлоадера.
  components:
  - type: StorageFill
    contents:
    - id: STWeaponRevolverChiappaRhino60DS
    - id: STSpeedLoader45ACP
      amount: 2
  - type: Tag
    tags:
    - WeaponCase
    - StalkerWeaponCase
    - StalkerWeaponCaseRevolver

