# Кейсы под сталкерские снайперки. Мосина и СКС — болтовки/самозарядки без магазина,
# заряжаются россыпью патронов прямо в ствол, поэтому вместо "2 магазинов" в кейс кладётся
# стопка патронов размером в ёмкость их ballistic-ammo (5 и 10 соответственно). Косметические
# скины (Grass, Covenant, Wood-самоделка, Seraphim, Oracle) отдельного кейса не получают.

- type: entity
  parent: STBaseWeaponCase
  id: STWeaponSniperMosinCase
  suffix: "Stalker, Кейс, Мосина"
  description: Кейс с оружием «Мосина» и стопка патронов — заряжается россыпью, магазина у неё нет.
  components:
  - type: StorageFill
    contents:
    - id: STWeaponSniperMosin
    - id: STCartridge754FMJ
      amount: 5
  - type: Tag
    tags:
    - WeaponCase
    - StalkerWeaponCase
    - StalkerWeaponCaseSniper

