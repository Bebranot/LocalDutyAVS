# Боеприпасы .44 Remington Magnum (Mateba) — порт из STALKER-14.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: BulletRemingtonMagnum
  name: bullet (.44 Remington Magnum)
  parent: STBasePistolBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 4
  - type: Projectile
    damage:
      types:
        Piercing: 24
  - type: StaminaDamageOnCollide
    damage: 8
  - type: DutyBallistics
    armorPenetration: 0.1
    arteryBonus: 0.01
    fractureChance: 0.015

- type: entity
  id: BulletRemingtonMagnumAP
  name: bullet (.44 Remington Magnum AP)
  parent: BulletRemingtonMagnum
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 22
  - type: DutyBallistics
    armorPenetration: 0.4
    arteryBonus: 0.01
    fractureChance: 0.015

- type: entity
  id: BulletRemingtonMagnumHP
  name: bullet (.44 Remington Magnum HP)
  parent: BulletRemingtonMagnum
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 18
        Slash: 7
        Blunt: 2
  - type: DutyBallistics
    armorPenetration: -0.25
    arteryBonus: 0.03

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  parent: BaseCartridge
  id: BaseCartridgeRemingtonMagnum
  name: cartridge (.44 remington magnum)
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - CartridgeRemingtonMagnum
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: CartridgeRemingtonMagnum
  name: cartridge (.44 Remington Magnum)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseCartridgeRemingtonMagnum
  components:
  - type: CartridgeAmmo
    proto: BulletRemingtonMagnum

- type: entity
  id: CartridgeRemingtonMagnumAP
  name: cartridge (.44 Remington Magnum AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseCartridgeRemingtonMagnum
  components:
  - type: CartridgeAmmo
    proto: BulletRemingtonMagnumAP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: CartridgeRemingtonMagnumHP
  name: cartridge (.44 Remington Magnum HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseCartridgeRemingtonMagnum
  components:
  - type: CartridgeAmmo
    proto: BulletRemingtonMagnumHP
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Спидлоадеры ──────────────────────────────────────────────────────────────
- type: entity
  id: BaseSpeedLoaderRemingtonMagnum
  name: спидлоадер (.44 remington magnum)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: BaseItem
  abstract: true
  components:
  - type: Tag
    tags:
    - SpeedLoaderRemingtonMagnum
  - type: SpeedLoader
  - type: BallisticAmmoProvider
    whitelist:
      tags:
      - CartridgeRemingtonMagnum
    capacity: 6
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container

- type: entity
  parent: BaseSpeedLoaderRemingtonMagnum
  id: SpeedLoaderRemingtonMagnum
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRemingtonMagnum
    whitelist:
      tags:
      - CartridgeRemingtonMagnum
    capacity: 6
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/SpeedLoaders/Magnum/magnum_speed_loader.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: base-6
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: base
    steps: 7
    zeroVisible: false
  - type: Appearance

- type: entity
  parent: SpeedLoaderRemingtonMagnum
  id: SpeedLoaderRemingtonMagnumAP
  components:
  - type: BallisticAmmoProvider
    proto: CartridgeRemingtonMagnumAP
    whitelist:
      tags:
      - CartridgeRemingtonMagnum
    capacity: 6

- type: entity
  parent: SpeedLoaderRemingtonMagnum
  id: SpeedLoaderRemingtonMagnumEmpty
  suffix: "Stalker, STWeapon, Огнестрел, Пустой"
  components:
  - type: BallisticAmmoProvider
    proto: null
    whitelist:
      tags:
      - CartridgeRemingtonMagnum
    capacity: 6
