# Базы портированного из STALKER-14 оружия — привязаны к нашим ванильным базам.
# Дают слои спрайта/визуал магазина, чтобы семейства стволов копировались почти вербатим.
# Кастомные компоненты (STWeight/STWeaponDamageFalloff/STWeaponAccuracy) — пустышки (см. StalkerStubComponents.cs).

# ── База рифлов ──────────────────────────────────────────────────────────────
- type: entity
  abstract: true
  parent: [ BaseWeaponRifle, ADTBaseAttachableHolder ]
  id: STBaseWeaponRifle
  name: rifle
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: STWeaponModuleContainer
  # Слот прицела для ВСЕХ рифлов (включая АК) — чтобы обвесы крепились единообразно.
  # Магазинные снайперки переопределяют его своим (sniper sight) — мерж по ключу.
  - type: ItemSlots
    slots:
      gun_module_scope:
        name: Scope
        priority: 2
        whitelist:
          tags:
          - STWeaponModuleRifleScopeRu
          - STWeaponModuleRifleScopeNato
  - type: FarGunshot
    range: 260
    sound:
      path: /Audio/_Stalker/Effects/FarGunshots/rifle1.ogg
  # ADT-обвесы (duty nizhe): планка прицела у рифлов уже занята сталкерским gun_module_scope,
  # поэтому rmc-aslot-rail сюда не идёт — только подствольное (грип/лазер), место свободно.
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - ADTAttachmentVerticalGrip
          - ADTAttachmentLaserSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0, 0

# ── База ПП (SMG) ────────────────────────────────────────────────────────────
- type: entity
  abstract: true
  parent: [ BaseWeaponSubMachineGun, ADTBaseAttachableHolder ]
  id: STBaseWeaponSMG
  name: smg
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: STWeaponModuleContainer
  - type: FarGunshot
    range: 190
    sound:
      path: /Audio/_Stalker/Effects/FarGunshots/smg1.ogg
  # ADT-обвесы (duty nizhe): подствол и цевьё у ПП уже заняты сталкерскими gun_module_grip/
  # muzzle, планка прицела — свободна, добавляем только коллиматор.
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - ADTAttachmentReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0, 0

# ── База пистолетов ──────────────────────────────────────────────────────────
- type: entity
  abstract: true
  parent: [ BaseWeaponPistol, ADTBaseAttachableHolder ]
  id: STBaseWeaponPistol
  name: pistol
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-0
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 1
    zeroVisible: true
  - type: Appearance
  - type: STWeaponModuleContainer
  - type: FarGunshot
    range: 120
    sound:
      path: /Audio/_Stalker/Effects/FarGunshots/pistol1.ogg
  # ADT-обвесы (duty nizhe): у пистолетов занят только gun_module_muzzle (глушитель),
  # планка сверху свободна — добавляем коллиматор. Подствольные грипы на пистолет
  # реалистично не вешаем.
  - type: AttachableHolder
    slots:
      rmc-aslot-rail:
        whitelist:
          tags:
          - ADTAttachmentReflexSight
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-rail: 0, 0

# ── База снайперок ───────────────────────────────────────────────────────────
# Болтовки заряжаются прямо в ствол (ballistic-ammo), часть — через магазин.
- type: entity
  abstract: true
  parent: [ BaseWeaponSniper, ADTBaseAttachableHolder ]
  id: STBaseWeaponSniper
  name: sniper
  components:
  - type: Sprite
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - map: ["enum.GunVisualLayers.Mag"]
  - type: GunWieldBonus
    minAngle: -50
    maxAngle: -50
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
        ents: []
      gun_module_scope: !type:ContainerSlot {}
      gun_module_muzzle: !type:ContainerSlot {}
  - type: ItemSlots
    slots:
      gun_module_scope:
        name: Scope
        priority: 2
        whitelist:
          tags:
          - STWeaponModuleSniperSight
      gun_module_muzzle:
        name: Muzzle
        priority: 1
        whitelist:
          tags:
          - STWeaponModuleSniperSilencer
  - type: STWeaponModuleContainer
  - type: FarGunshot
    range: 350
    sound:
      path: /Audio/_Stalker/Effects/FarGunshots/sniper1.ogg
  # ADT-обвесы (duty nizhe): прицел и глушитель уже заняты сталкерскими слотами; свободно
  # только подствольное — и то только сошки-грип, лазер на снайперку вешать нелогично.
  - type: AttachableHolder
    slots:
      rmc-aslot-underbarrel:
        whitelist:
          tags:
          - ADTAttachmentVerticalGrip
  - type: AttachableHolderVisuals
    offsets:
      rmc-aslot-underbarrel: 0, 0

# ── База револьверов ─────────────────────────────────────────────────────────
- type: entity
  abstract: true
  parent: BaseWeaponRevolver
  id: STBaseWeaponRevolver
  name: revolver
  components:
  - type: FarGunshot
    range: 170
    sound:
      path: /Audio/_Stalker/Effects/FarGunshots/pistol1.ogg

