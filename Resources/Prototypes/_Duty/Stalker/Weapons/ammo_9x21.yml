# Боеприпасы 9x21 — порт из STALKER-14. Mutant→Piercing.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: Bullet921PGJ
  name: bullet (9x21)
  parent: STBasePistolBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 2
  - type: Projectile
    damage:
      types:
        Piercing: 15
  - type: StaminaDamageOnCollide
    damage: 2
  - type: DutyBallistics
    armorPenetration: 0.25

- type: entity
  id: Bullet9217N42
  name: bullet (9x21 AP)
  parent: Bullet921PGJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 14
  - type: DutyBallistics
    armorPenetration: 0.55

- type: entity
  id: Bullet921PEGJ
  name: bullet (9x21 HP)
  parent: Bullet921PGJ
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 11
        Slash: 4
        Blunt: 2
  - type: DutyBallistics
    armorPenetration: -0.1
    arteryBonus: 0.02

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  id: STCartridge921
  name: cartridge (9х21 auto)
  parent: BaseCartridge
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - STCartridge921
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: STCartridge921PGJ
  name: cartridge (9x21)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge921
  components:
  - type: CartridgeAmmo
    proto: Bullet921PGJ

- type: entity
  id: STCartridge9217N42
  name: cartridge (9x21 AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge921
  components:
  - type: CartridgeAmmo
    proto: Bullet9217N42
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: STCartridge921PEGJ
  name: cartridge (9x21 HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge921
  components:
  - type: CartridgeAmmo
    proto: Bullet921PEGJ
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Магазины ─────────────────────────────────────────────────────────────────
- type: entity
  id: SR2MMag20
  name: магазин СР-2М "Вереск" 9х21 (20)
  description: Магазин 9x21 мм для СР-2М. Вместимость 20.
  parent: BaseItem
  suffix: "Stalker, STWeapon, Огнестрел"
  components:
  - type: Tag
    tags:
    - MagazineSR2M
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge921PGJ
    whitelist:
      tags:
      - STCartridge921
    capacity: 20
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/919/pp-91.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: SR2MMag30
  name: магазин СР-2М "Вереск" 9х21 (30)
  description: Магазин 9x21 мм для СР-2М. Вместимость 30.
  parent: SR2MMag20
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge921PGJ
    whitelist:
      tags:
      - STCartridge921
    capacity: 30
