# Боеприпасы 9x39 — порт из STALKER-14. Mutant→Piercing.

# ── Снаряды ──────────────────────────────────────────────────────────────────
# Три роли на калибр (см. bases.yml): обычный / бронебойный (БП) / экспансивный.
- type: entity
  id: STBullet9x39SP5
  name: bullet (9x39)
  parent: STBaseSPBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 6
  - type: Projectile
    damage:
      types:
        Piercing: 20
  - type: StaminaDamageOnCollide
    damage: 4
  - type: DutyBallistics
    armorPenetration: 0.3
    arteryBonus: 0.01
    fractureChance: 0.005

- type: entity
  id: STBullet9x39SP6
  name: bullet (9x39 AP)
  parent: STBullet9x39SP5
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 18
  - type: DutyBallistics
    armorPenetration: 0.6
    arteryBonus: 0.01
    fractureChance: 0.005

- type: entity
  id: STBullet9x39PSO
  name: bullet (9x39 HP)
  parent: STBullet9x39SP5
  categories: [ HideSpawnMenu ]
  components:
  - type: Projectile
    damage:
      types:
        Piercing: 15
        Slash: 6
        Blunt: 2
  - type: DutyBallistics
    armorPenetration: -0.05
    arteryBonus: 0.03

# ── Патроны ──────────────────────────────────────────────────────────────────
- type: entity
  parent: BaseCartridge
  id: STCartridge9x39
  abstract: true
  components:
  - type: Tag
    tags:
    - Cartridge
    - STCartridge939
  - type: CartridgeAmmo
    deleteOnSpawn: true
  - type: Sprite
    sprite: Objects/Weapons/Guns/Ammunition/Casings/ammo_casing.rsi
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
  - type: Appearance
  - type: SpentAmmoVisuals
    state: "base"

- type: entity
  id: STCartridge9x39SP5
  name: cartridge (9x39)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge9x39
  components:
  - type: CartridgeAmmo
    proto: STBullet9x39SP5

- type: entity
  id: STCartridge9x39SP6
  name: cartridge (9x39 AP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge9x39
  components:
  - type: CartridgeAmmo
    proto: STBullet9x39SP6
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#2b2b2b"

- type: entity
  id: STCartridge9x39PSO
  name: cartridge (9x39 HP)
  suffix: "Stalker, STWeapon, Огнестрел"
  parent: STCartridge9x39
  components:
  - type: CartridgeAmmo
    proto: STBullet9x39PSO
  - type: Sprite
    layers:
    - state: base
      map: ["enum.AmmoVisualLayers.Base"]
    - state: tip
      map: ["enum.AmmoVisualLayers.Tip"]
      color: "#4f86c6"


# ── Магазины ─────────────────────────────────────────────────────────────────
- type: entity
  id: Base939Mag10
  name: magazine 9x39 (10)
  suffix: "Stalker, STWeapon, Огнестрел"
  description: Магазин 9x39 для автоматов и специальных снайперских винтовок. Вместимость 10.
  parent: BaseItem
  components:
  - type: Tag
    tags:
    - Magazine939
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge9x39SP5
    whitelist:
      tags:
      - STCartridge939
    capacity: 10
  - type: Item
    size: Small
    shape:
    - 0,0,0,0
  - type: ContainerContainer
    containers:
      ballistic-ammo: !type:Container
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/939/10.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
  - type: MagazineVisuals
    magState: mag
    steps: 2
    zeroVisible: false
  - type: Appearance

- type: entity
  id: Magazine939x20
  name: magazine 9x39 (20)
  suffix: "Stalker, STWeapon, Огнестрел"
  description: Магазин 9x39, повышенная ёмкость. Вместимость 20.
  parent: Base939Mag10
  components:
  - type: BallisticAmmoProvider
    mayTransfer: true
    proto: STCartridge9x39SP5
    whitelist:
      tags:
      - STCartridge939
    capacity: 20
  - type: Item
    size: Small
    shape:
    - 0,0,0,1
  - type: Sprite
    scale: 0.8, 0.8
    sprite: _Stalker/Objects/Weapons/Guns/Ammunition/Magazines/939/20.rsi
    layers:
    - state: base
      map: ["enum.GunVisualLayers.Base"]
    - state: mag-1
      map: ["enum.GunVisualLayers.Mag"]
