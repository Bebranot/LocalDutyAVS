# Duty: эмоут для системы двуручного блока (TwoHandedBlockSystem) — "(персонаж) ставит блок".
# Программный эмоут: не выбирается вручную (available: false), без chat-триггеров,
# вызывается системой через TryEmoteWithChat(..., forceEmote: true).

- type: emote
  id: DutyTwoHandedBlock
  name: chat-emote-name-duty-two-handed-block
  category: General
  available: false
  chatMessages: ["ставит блок"]

# Итог QTE-дуэли. Выдаётся каждому участнику по его исходу, чтобы окружающие поняли,
# чем закончилась схватка, даже не видя саму катсцену.

- type: emote
  id: DutyParrySuccess
  name: chat-emote-name-duty-parry-success
  category: General
  available: false
  chatMessages: ["успешно парирует удар!"]

- type: emote
  id: DutyParryFail
  name: chat-emote-name-duty-parry-fail
  category: General
  available: false
  chatMessages: ["неудачно парирует удар"]
