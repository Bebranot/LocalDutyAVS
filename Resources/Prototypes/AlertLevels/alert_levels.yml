- type: alertLevels
  id: stationAlerts
  defaultLevel: green
  levels:
    green:
      announcement: alert-level-green-announcement
      sound: /Audio/_Duty/Announcement/code_green.ogg
      color: Green
      emergencyLightColor: LawnGreen
      shuttleTime: 300
    blue:
      announcement: alert-level-blue-announcement
      sound: /Audio/_Duty/Announcement/code_blue.ogg
      color: DodgerBlue
      forceEnableEmergencyLights: true
      emergencyLightColor: DodgerBlue
      shuttleTime: 600
    violet:
      announcement: alert-level-violet-announcement
      sound: /Audio/_Duty/Announcement/code_violet.ogg
      color: Violet
      emergencyLightColor: Violet
      forceEnableEmergencyLights: true
      shuttleTime: 600
    yellow:
      announcement: alert-level-yellow-announcement
      sound: /Audio/_Duty/Announcement/code_yellow.ogg
      color: Yellow
      emergencyLightColor: Goldenrod
      forceEnableEmergencyLights: true
      shuttleTime: 600
    red:
      announcement: alert-level-red-announcement
      sound: !type:SoundCollectionSpecifier
        collection: DutyCodeRed
      color: Red
      emergencyLightColor: Red
      forceEnableEmergencyLights: true
      shuttleTime: 600 #No reduction in time as we don't have swiping for red alert like in /tg/. Shuttle times are intended to create friction, so having a way to brainlessly bypass that would be dumb.
    gamma:
      announcement: alert-level-gamma-announcement
      selectable: false
      sound:
        path: /Audio/_Duty/Announcement/code_gamma.ogg
        params:
          volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
    delta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound:
        path: /Audio/_Duty/Announcement/code_delta.ogg
        params:
          volume: -1 # ADT-Tweak
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    epsilon:
      announcement: alert-level-epsilon-announcement
      selectable: false
      sound:
        path: /Audio/_Duty/Announcement/code_epsilon.ogg
        params:
          volume: -2
      disableSelection: true
      color: DarkViolet
      emergencyLightColor: DarkViolet
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    amber: #ADT start
      announcement: alert-level-amber-announcement
      sound:
        path: /Audio/ADT/Misc/amber.ogg
        params:
          volume: -2
      color: "#ffbf00"
      emergencyLightColor: "#ffbf00"
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    altdelta:
      announcement: alert-level-delta-announcement
      selectable: false
      sound:
        path: /Audio/Misc/delta_alt.ogg
        params:
          volume: -1 # ADT-Tweak
      disableSelection: true
      color: DarkRed
      emergencyLightColor: Orange
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    cascade:
      announcement: alert-level-cascade-announcement
      selectable: false
      sound:
        path: /Audio/ADT/Supermatter/thecascade.ogg
        params:
          volume: -2
      disableSelection: true
      color: PaleVioletRed
      emergencyLightColor: PaleVioletRed
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    #ADT end
    # _Duty: протокол «Альфа» — автоматический ответ на объявление войны ядерными оперативниками.
    # Выставляется только кодом (DutyCodeAlphaSystem), поэтому selectable: false + disableSelection.
    # disableSelection не «залипает» навсегда: IsSelectable считается от ТЕКУЩЕГО уровня, так что
    # после возврата на green консоль связи снова работает.
    alpha:
      announcement: alert-level-alpha-announcement
      selectable: false
      disableSelection: true
      sound:
        path: /Audio/ADT/Announcements/announce_syndi.ogg
      color: "#8A0303"
      emergencyLightColor: "#8A0303"
      forceEnableEmergencyLights: true
      shuttleTime: 1200
    #ADT start
    # kappa:
    #   announcement: alert-level-kappa-announcement
    #   selectable: false
    #   sound: /Audio/ADT/Misc/kappa.ogg
    #   color: Cyan
    #   emergencyLightColor: "#00ffea"
    #   shuttleTime: 600
    #   disableSelection: true
      #ADT end
